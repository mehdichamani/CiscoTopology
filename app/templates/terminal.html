<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیم‌بان | وب‌ترمینال — {{ switch_ip }}</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64x64.png">

    <!-- Google Fonts (Non-blocking with robust monospace fallbacks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    </noscript>

    <!-- Xterm.js CSS & JS (Local Vendor Bundle - Offline & Fast) -->
    <link rel="stylesheet" href="/static/vendor/xterm/xterm.css" />
    <script src="/static/vendor/xterm/xterm.js"></script>
    <script src="/static/vendor/xterm/xterm-addon-fit.js"></script>

    <style>
        :root {
            --bg-body: #141312;
            --header-bg: #181715;
            --terminal-bg: #1f1e1b;
            --border-color: #252320;
            --text-primary: #faf9f5;
            --accent-coral: #cc785c;
            --accent-teal: #5db8a6;
        }

        [data-theme="light"] {
            --bg-body: #faf9f5;
            --header-bg: #efe9de;
            --terminal-bg: #181715;
            --border-color: #e6dfd8;
            --text-primary: #141413;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .header-title code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(204, 120, 92, 0.15);
            color: var(--accent-coral);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 500;
        }
        .status-connecting { background: rgba(232, 165, 90, 0.2); color: #e8a55a; border: 1px solid #e8a55a; }
        .status-connected { background: rgba(93, 184, 114, 0.2); color: #5db872; border: 1px solid #5db872; }
        .status-disconnected { background: rgba(198, 69, 69, 0.2); color: #c64545; border: 1px solid #c64545; }
        
        .controls {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn:hover {
            border-color: var(--accent-coral);
            color: var(--accent-coral);
        }

        #terminal-container {
            flex: 1;
            padding: 12px;
            background: var(--terminal-bg);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <img src="/static/img/favicon-32x32.png" alt="Cisco" style="width: 20px; height: 20px; border-radius: 4px; vertical-align: middle;">
            <span>Cisco Terminal Session:</span>
            <code id="target-ip">{{ switch_ip }}</code>
            <span id="conn-status" class="status-badge status-connecting">Connecting...</span>
        </div>
        <div class="controls">
            <button class="btn" onclick="toggleTerminalTheme()" id="theme-btn">🌙 Theme</button>
            <button class="btn" onclick="connectWebSocket()" id="reconn-btn">🔄 Reconnect</button>
            <button class="btn" onclick="clearTerminal()" id="clear-btn">🧹 Clear</button>
        </div>
    </div>

    <div id="terminal-container"></div>

    <script>
        const switchIp = "{{ switch_ip }}";
        let term, fitAddon, ws;
        let currentTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        document.addEventListener('DOMContentLoaded', () => {
            applyTerminalTheme(currentTheme);
            initTerminal();
            connectWebSocket();
        });

        function applyTerminalTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-theme', theme);
            const themeBtn = document.getElementById('theme-btn');
            if (themeBtn) themeBtn.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';

            if (term) {
                term.options.theme = {
                    background: theme === 'light' ? '#faf9f5' : '#181715',
                    foreground: theme === 'light' ? '#141413' : '#faf9f5',
                    cursor: '#cc785c',
                    selectionBackground: 'rgba(204, 120, 92, 0.3)'
                };
            }
        }

        function toggleTerminalTheme() {
            const next = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', next);
            applyTerminalTheme(next);
        }

        function initTerminal() {
            term = new Terminal({
                cursorBlink: true,
                fontFamily: '"JetBrains Mono", Consolas, "Courier New", monospace',
                fontSize: 14,
                theme: {
                    background: currentTheme === 'light' ? '#faf9f5' : '#181715',
                    foreground: currentTheme === 'light' ? '#141413' : '#faf9f5',
                    cursor: '#cc785c',
                    selectionBackground: 'rgba(204, 120, 92, 0.3)'
                }
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            const container = document.getElementById('terminal-container');
            term.open(container);
            fitAddon.fit();

            window.addEventListener('resize', () => fitAddon.fit());

            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });
        }

        function connectWebSocket() {
            const statusEl = document.getElementById('conn-status');
            statusEl.className = 'status-badge status-connecting';
            statusEl.textContent = 'Connecting...';

            if (ws) {
                ws.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/terminal/${encodeURIComponent(switchIp)}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.className = 'status-badge status-connected';
                statusEl.textContent = 'Connected';
            };

            ws.onmessage = (event) => {
                term.write(event.data);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
                statusEl.className = 'status-badge status-disconnected';
                statusEl.textContent = 'Error';
            };

            ws.onclose = () => {
                statusEl.className = 'status-badge status-disconnected';
                statusEl.textContent = 'Disconnected';
            };
        }

        function clearTerminal() {
            if (term) term.clear();
        }
    </script>
</body>
</html>
