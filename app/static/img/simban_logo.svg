<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="simban-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow-simban" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="#170c28"/>
  <!-- Switch Chassis & Switching Data Arrows -->
  <g filter="url(#glow-simban)">
    <!-- Switch Box Body -->
    <rect x="12" y="24" width="40" height="20" rx="5" fill="url(#simban-grad)"/>
    <!-- Switch Front Panel Inset -->
    <rect x="15" y="27" width="34" height="14" rx="3" fill="#0d061a"/>
    
    <!-- Ethernet Port Pins / LEDs -->
    <rect x="18" y="30" width="4" height="4" rx="1" fill="#34d399"/>
    <rect x="24" y="30" width="4" height="4" rx="1" fill="#34d399"/>
    <rect x="30" y="30" width="4" height="4" rx="1" fill="#facc15"/>
    <rect x="36" y="30" width="4" height="4" rx="1" fill="#34d399"/>
    <rect x="42" y="30" width="4" height="4" rx="1" fill="#a855f7"/>

    <!-- Switching Arrows Symbol Overlay (Standard Switch Data Arrows) -->
    <!-- Top Arrow Right -->
    <path d="M22 37H32M32 37L28 35M32 37L28 39" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Arrow Left -->
    <path d="M42 37H32M32 37L36 35M32 37L36 39" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cisco Style Rack Ears (Subtle) -->
    <rect x="9" y="29" width="3" height="10" rx="1" fill="#581c87"/>
    <rect x="52" y="29" width="3" height="10" rx="1" fill="#581c87"/>
  </g>
</svg>
